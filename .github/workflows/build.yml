name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Installs Gradle 9.4.0 so no committed wrapper is needed.
      # If you commit gradlew, you can replace this and the build step with ./gradlew build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vlineaim
          path: build/libs/*.jar

      - name: Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
